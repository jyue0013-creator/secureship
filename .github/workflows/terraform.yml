name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # needed for OIDC login to AWS
  contents: read

jobs:
  # JOB 1: Security scan, which runs first
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov (Terraform misconfigurations)
        run: |
          pip install checkov
          checkov -d . --framework terraform --compact --config-file .checkov.yaml

      - name: Trivy (misconfigurations, secrets, vulnerabilities)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest \
            fs . --scanners misconfig,secret,vuln --severity HIGH,CRITICAL --exit-code 1

  # JOB 2: Terraform, which only runs if the security scan passes
  terraform:
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to AWS via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::402545554662:role/github-actions-secureship
          aws-region: ap-southeast-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply (only on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false tfplan